<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>和幸贈さいと♡</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      /* 桃色（#fbc2eb）から藤色（#a6c1ee）へのグラデーション */
      background: linear-gradient(135deg, #fbc2eb 0%, #a6c1ee 100%);
      background-attachment: fixed;
      color: #333;
      padding: 20px;
    }

    /* グラスモーフィズムカード容器 */
    .glass-card {
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 20px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 800px;
      box-shadow: 0 8px 32px 0 rgba(166, 193, 238, 0.37);
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
      color: #222;
      text-align: center;
    }
h3 {
      color: #222;
      text-align: center;
    }
    p.subtitle {
      text-align: center;
      font-size: 0.95rem;
      color: #555;
      margin-bottom: 2rem;
    }

    /* テーブルデザイン */
    .table-container {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
    }

    th {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #444;
      background: rgba(255, 255, 255, 0.15);
    }

    td {
      font-size: 0.95rem;
    }

    tr:hover td {
      background: rgba(255, 255, 255, 0.2);
    }

    /* タグ表示 */
    .tag {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: bold;
      background: rgba(255, 255, 255, 0.5);
      color: #4a4a4a;
    }

    /* リンクボタン */
    .link-btn {
      display: inline-block;
      padding: 0.4rem 1rem;
      color: #4a4a4a;
      background: rgba(255, 255, 255, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 30px;
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: bold;
      transition: all 0.2s ease;
    }

    .link-btn:hover {
      background: rgba(255, 255, 255, 0.8);
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <main class="glass-card">
    <h1>和幸贈さいとへようこそ♡</h1>
    <h3>鷲尾が制作したサイトのトップです</h3>
    <p class="subtitle">washio5757-commits.github.io の公開コンテンツ一覧</p>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>サイト名</th>
            <th>概要</th>
            <th>リンク</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><strong>WashioWeather</strong></td>
            <td>天気予報です♡</td>
            <td><a href="./weat/" class="link-btn">訪問する ➔</a></td>
          </tr>
          <tr>
            <td><strong>WashioMaps</strong></td>
            <td>マップです♡</td>
            <td><a href="./maps/" class="link-btn">訪問する ➔</a></td>
          </tr>
          <tr>
            <td><strong>Profile</strong></td>
            <td>自己紹介・各種SNSリンク</td>
            <td><a href="./profile/" class="link-btn">訪問する ➔</a></td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

</body>
</html>
